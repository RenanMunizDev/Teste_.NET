name: CI/CD Pipeline

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      # Checkout do código
      - name: Checkout code
        uses: actions/checkout@v3

      # Setup .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'  # ajuste conforme sua versão exata

      # Restaurar dependências
      - name: Restore dependencies
        run: dotnet restore ZOSS.Teste.API/ZOSS.Teste.API.csproj

      # Build do projeto
      - name: Build
        run: dotnet build ZOSS.Teste.API/ZOSS.Teste.API.csproj --no-restore

      # Rodar testes
      - name: Run tests
        run: dotnet test ZOSS.Teste.API/ZOSS.Teste.API.csproj --no-build --verbosity normal


  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test  # só roda depois do build/test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Login no Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build da imagem Docker
      - name: Build Docker image
        run: docker build -t renanmunizdev/teste-net-api:latest .

      # Push para Docker Hub
      - name: Push Docker image
        run: docker push renanmunizdev/teste-net-api:latest
